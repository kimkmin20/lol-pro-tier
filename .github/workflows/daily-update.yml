name: Daily data update
on:
  schedule:
    - cron: "17 21 * * *"   # every day 06:17 KST
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new games, champion names and patch notes
        run: python scripts/update.py
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Daily data update $(date -u +%F)" && git pull --rebase && git push; fi
