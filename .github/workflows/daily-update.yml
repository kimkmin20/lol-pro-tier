name: Daily data update
on:
  schedule:
    - cron: "17 21 * * *"   # 06:17 KST
    - cron: "17 5 * * *"    # 14:17 KST (another try when a source was busy in the morning)
    - cron: "17 13 * * *"   # 22:17 KST
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch new games, champion names and patch notes
        run: python3 scripts/update.py
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Daily data update $(date -u +%F)" && git pull --rebase && git push; fi
